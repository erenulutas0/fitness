name: forma_mobile
description: FORMA mobile app - real-time camera form coach for home strength training.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  forma_content:
    path: ../../content
  forma_pose:
    path: ../../packages/forma_pose
  forma_rules:
    path: ../../packages/forma_rules
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.0

dev_dependencies:
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
