name: forma_pose
description: >-
  Camera + MediaPipe Pose Landmarker plugin for FORMA. Native layer does camera
  capture and on-device inference only; frames never leave the device. Emits
  PoseFrame (33 landmarks + world landmarks) over a binary EventChannel.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  forma_rules:
    path: ../forma_rules
  meta: ^1.17.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  # Pose models live in the plugin so the app and the example share one copy.
  # They are gitignored; run tools/fetch_models.{ps1,sh} after a fresh clone.
  assets:
    - assets/models/
  plugin:
    platforms:
      android:
        package: app.forma.forma_pose
        pluginClass: FormaPosePlugin
      ios:
        pluginClass: FormaPosePlugin
