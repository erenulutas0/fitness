name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Rules engine (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: dart pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed packages/forma_rules tools/eval
      - name: Analyze forma_rules
        run: dart analyze packages/forma_rules
      - name: Test forma_rules
        working-directory: packages/forma_rules
        run: dart test --reporter expanded
      - name: Eval report (synthetic fixtures)
        working-directory: tools/eval
        run: dart run bin/eval.dart --out ../../docs/eval/latest.md --json ../../docs/eval/latest.json
      - uses: actions/upload-artifact@v5
        with:
          name: eval-report
          path: docs/eval/

  flutter:
    name: App + plugin (analyze, test, Android debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - name: Fetch pose models
        run: sh tools/fetch_models.sh lite
      - name: Analyze plugin
        run: flutter analyze packages/forma_pose
      - name: Test plugin
        working-directory: packages/forma_pose
        run: flutter test
      - name: Codegen (riverpod / l10n)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze app
        run: flutter analyze apps/mobile
      - name: Riverpod lints
        working-directory: apps/mobile
        run: dart run custom_lint
      - name: Test app
        working-directory: apps/mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Build release App Bundle
        working-directory: apps/mobile
        # AAB is the release format: Play splits it per ABI, so a phone
        # downloads ~40 MB instead of the 92 MB of a three-ABI APK.
        run: flutter build appbundle --release
      - name: Check 16 KB page-size alignment of native libraries
        run: python3 tools/check_so_alignment.py apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: forma-builds
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
